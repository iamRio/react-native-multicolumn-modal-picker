name: CI and package publish

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validation
        run: npm run validate

  detect-version-bump:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      should_create_release: ${{ steps.detect.outputs.should_create_release }}
      package_version: ${{ steps.detect.outputs.package_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0

      - name: Detect a release-worthy version change
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          should_publish=false
          should_create_release=false
          package_version="$(node -p "require('./package.json').version")"

          if [ "$EVENT_NAME" = "push" ] &&
             [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ] &&
             [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            previous_version="$(git show "$BEFORE_SHA:package.json" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => process.stdout.write(JSON.parse(input).version))")"

            if [ "$previous_version" != "$package_version" ]; then
              commit_messages="$(git log --format=%B "$BEFORE_SHA..$HEAD_SHA")"
              if ! grep -Fq '[skip release]' <<< "$commit_messages"; then
                should_publish=true
                should_create_release=true
              fi
            fi
          fi

          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "should_create_release=$should_create_release" >> "$GITHUB_OUTPUT"

  publish-npm:
    if: ${{ needs.detect-version-bump.outputs.should_publish == 'true' }}
    needs: [validate, detect-version-bump]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js for npm publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Set up npm for trusted publishing
        run: |
          npm install --global npm@latest
          npm_version="$(npm --version)"
          NPM_VERSION="$npm_version" node -e '
            const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error(`npm ${process.env.NPM_VERSION} is too old for trusted publishing; npm 11.5.1 or later is required.`);
              process.exit(1);
            }
          '

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

  create-github-release:
    if: ${{ needs.detect-version-bump.outputs.should_create_release == 'true' }}
    needs: [detect-version-bump, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.detect-version-bump.outputs.package_version }}
          RELEASE_TARGET: ${{ github.sha }}
        run: gh release create "v${PACKAGE_VERSION}" --target "$RELEASE_TARGET" --generate-notes
