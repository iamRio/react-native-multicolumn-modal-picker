name: CI and package publish

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validation
        run: npm run validate

  publish-npm:
    if: ${{ github.event_name == 'release' }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js for npm publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

  update-example:
    if: ${{ github.event_name == 'release' && needs.publish-npm.result == 'success' }}
    needs: publish-npm
    runs-on: ubuntu-latest
    concurrency:
      group: update-example-${{ github.event.repository.default_branch }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: example-app/package-lock.json

      - name: Update example app dependency
        working-directory: example-app
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="${RELEASE_TAG#v}"

          for attempt in {1..15}; do
            if npm view "react-native-multicolumn-modal-picker@${package_version}" version --registry=https://registry.npmjs.org/ | grep -qx "${package_version}"; then
              break
            fi

            if [ "${attempt}" -eq 15 ]; then
              echo "Version ${package_version} is not available on npm after waiting for registry propagation."
              exit 1
            fi

            echo "Waiting for react-native-multicolumn-modal-picker@${package_version} to become available on npm (attempt ${attempt}/15)."
            sleep 60
          done

          npm install "react-native-multicolumn-modal-picker@${package_version}" --save-exact --package-lock-only --ignore-scripts

      - name: Create example app update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="${RELEASE_TAG#v}"
          branch="chore/update-example-${package_version}"

          if git diff --quiet -- example-app/package.json example-app/package-lock.json; then
            echo "Example app is already using the published version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch" 2>/dev/null || git checkout "$branch"
          git add example-app/package.json example-app/package-lock.json
          git commit -m "chore: update example app to ${package_version}" || echo "No changes to commit"
          git push --set-upstream origin "$branch" --force-with-lease
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore: update example app to ${package_version}" \
            --body "Updates the example app to react-native-multicolumn-modal-picker ${package_version}." \
            || echo "Pull request already exists."
